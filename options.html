<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto Mute Tabs — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>Auto Mute Tabs</h1>
  <p class="desc">
    Domains listed here will not mute other tabs when they start playing audio.
    They can still be muted if another (non-excluded) domain starts playing.
  </p>

  <div class="add-row">
    <input type="text" id="domain-input" placeholder="example.com">
    <button id="add-btn">Add</button>
  </div>
  <p class="hint">Enter a hostname, e.g. youtube.com. Subdomains (www.youtube.com) are matched automatically.</p>

  <ul id="domain-list"></ul>

  <p id="empty-msg" class="empty-msg">No excluded domains.</p>
</body>
<script src="options.js"></script>
</html>
